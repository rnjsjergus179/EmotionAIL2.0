<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- SEO를 위한 메타 태그 -->
  <title>EmotionAIL - AI 3D 비서</title>
  <meta name="description" content="EmotionAIL은 AI 3D 비서로, 자연어 처리, 음성 인식, 캘린더 관리, 날씨 정보 등을 제공합니다. 혁신적인 3D 인터랙션을 경험하세요.">
  <meta name="keywords" content="AI 비서, 3D 비서, EmotionAIL, 음성 명령, 캘린더 AI, 웹 비서, 인공지능 비서, 한국 AI">
  <meta name="author" content="Kwon Deok-Hyeon">
  
  <!-- SNS 미리보기를 위한 Open Graph 태그 -->
  <meta property="og:title" content="EmotionAIL - AI 3D 비서">
  <meta property="og:description" content="몰입형 AI 3D 비서를 경험해보세요. 실시간 인터랙션과 자연어 처리, 음성 인식까지!">
  <meta property="og:image" content="https://raw.githubusercontent.com/rnjsjergus179/EmotionAIL2.0/main/AI3D비서.jpg">
  <meta property="og:url" content="https://emotionailpremiumservice.site/2.0">
  
  <!-- 스타일시트 (style.css 내용 통합) -->
  <style>
    /* 기본 스타일 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Courier New', monospace; overflow: hidden; }

    /* 오른쪽 채팅창 HUD */
    #right-hud {
      position: fixed;
      top: 10%;
      right: 1%;
      width: 20%;
      padding: 1%;
      background: rgba(255,255,255,0.8);
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 20;
    }
    #region-select {
      width: 100%;
      padding: 5px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    #chat-log {
      display: none;
      height: 100px;
      overflow-y: scroll;
      border: 1px solid #ccc;
      padding: 5px;
      margin-top: 10px;
      border-radius: 3px;
      background: #fff;
    }
    #chat-input-area {
      display: flex;
      margin-top: 10px;
    }
    #chat-input {
      flex: 1;
      padding: 5px;
      font-size: 14px;
    }

    /* HUD-6: 음성 입력 영역 */
    #hud-6 {
      position: fixed;
      top: 45%;
      right: 1%;
      width: 20%;
      padding: 5px;
      background: rgba(255,255,255,0.95);
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 25;
      text-align: center;
    }
    #hud-6 button {
      padding: 8px 12px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background: #00ffcc;
      color: #000;
      cursor: pointer;
      transition: background 0.3s;
    }
    #hud-6 button:hover {
      background: #00cc99;
    }

    /* 왼쪽 캘린더 HUD */
    #left-hud {
      position: fixed;
      top: 10%;
      left: 1%;
      width: 20%;
      padding: 1%;
      background: rgba(0,0,0,0.7);
      border: 2px solid #00ffcc;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,255,204,0.5);
      z-index: 20;
      max-height: 80vh;
      overflow-y: auto;
      color: #00ffcc;
    }
    #left-hud h3 {
      margin-bottom: 5px;
      text-shadow: 0 0 5px #00ffcc;
    }
    #calendar-container { margin-top: 10px; }
    #calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    #calendar-header button {
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 3px;
      box-shadow: 0 0 5px #00ffcc;
      transition: all 0.3s;
    }
    #calendar-header button:hover {
      background: #00cc99;
      box-shadow: 0 0 10px #00ffcc;
    }
    #month-year-label {
      font-weight: bold;
      font-size: 14px;
      text-shadow: 0 0 5px #00ffcc;
    }
    #year-select {
      font-size: 12px;
      padding: 2px;
      margin-left: 5px;
      background: #333;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 3px;
    }
    #calendar-actions {
      margin-top: 5px;
      text-align: center;
    }
    #calendar-actions button {
      margin: 2px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 3px;
      box-shadow: 0 0 5px #00ffcc;
      transition: all 0.3s;
    }
    #calendar-actions button:hover {
      background: #00cc99;
      box-shadow: 0 0 10px #00ffcc;
    }
    #calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    #calendar-grid div {
      background: rgba(255,255,255,0.1);
      border: 1px solid #00ffcc;
      border-radius: 4px;
      min-height: 25px;
      font-size: 10px;
      padding: 2px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s;
    }
    #calendar-grid div:hover {
      background: rgba(0,255,204,0.3);
      box-shadow: 0 0 5px #00ffcc;
    }
    .day-number {
      position: absolute;
      top: 2px;
      left: 2px;
      font-weight: bold;
      font-size: 10px;
      color: #00ffcc;
      text-shadow: 0 0 3px #00ffcc;
    }
    .event {
      margin-top: 14px;
      font-size: 8px;
      color: #00ffcc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 0 3px #00ffcc;
    }

    /* HUD-7: 버전 정보 바 */
    #hud-7 {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background: rgba(0,0,0,0.8);
      color: #00ffcc;
      text-align: center;
      line-height: 30px;
      font-size: 14px;
      z-index: 50;
      box-shadow: 0 -2px 5px rgba(0,255,204,0.3);
    }

    /* 메인 캔버스와 말풍선 */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
    #speech-bubble {
      position: fixed;
      background: white;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12px;
      display: none;
      z-index: 30;
      white-space: pre-line;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 지도 또는 유튜브 영역 */
    #hud-3 {
      position: fixed;
      top: 70%;
      right: 1%;
      width: 20%;
      height: 20%;
      padding: 1%;
      background: rgba(255,255,255,0.9);
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 20;
      overflow: hidden;
    }

    @media (max-width: 480px) {
      #right-hud, #left-hud, #hud-3, #hud-6 {
        width: 90%; 
        left: 5%; 
        right: 5%; 
        top: 5%;
      }
    }
  </style>
  
  <!-- 스크립트 연결 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
  <div id="right-hud">
    <h3>채팅창</h3>
    <select id="region-select" onchange="changeRegion(this.value)">
      <option value="" disabled>지역 선택</option>
    </select>
    <div id="chat-log"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="채팅 입력..." />
    </div>
  </div>
  <div id="hud-6">
    <button onclick="startSpeechRecognition()">🎤 음성 입력</button>
  </div>
  <div id="hud-3">
    <iframe id="map-iframe" src="https://www.google.com/maps?q=Seoul&output=embed" frameborder="0" style="width:100%; height:100%; border:0;" allowfullscreen></iframe>
  </div>
  <div id="left-hud">
    <h3>캘린더</h3>
    <div id="calendar-container">
      <div id="calendar-header">
        <button id="prev-month">◀</button>
        <span id="month-year-label"></span>
        <button id="next-month">▶</button>
        <select id="year-select"></select>
      </div>
      <div id="calendar-actions">
        <button id="delete-day-event">하루일정 삭제</button>
      </div>
      <div id="calendar-grid"></div>
    </div>
  </div>
  <div id="speech-bubble"></div>
  <div id="hud-7">버전 2.0</div>
  <canvas id="canvas"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
